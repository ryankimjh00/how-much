apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: howmuch
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn-kr-single
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: howmuch
spec:
  selector:
    app: howmuch-postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: howmuch
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: howmuch-postgres
  template:
    metadata:
      labels:
        app: howmuch-postgres
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: worker-kr-1
      securityContext:
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
          args: ["-c", "shared_buffers=64MB", "-c", "max_connections=20", "-c", "max_wal_size=256MB", "-c", "min_wal_size=80MB"]
          env:
            - name: POSTGRES_DB
              value: howmuch
            - name: POSTGRES_USER
              value: howmuch
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: database
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          readinessProbe:
            exec:
              command: [pg_isready, -U, howmuch, -d, howmuch]
            periodSeconds: 5
          startupProbe:
            exec:
              command: [pg_isready, -U, howmuch, -d, howmuch]
            periodSeconds: 5
            failureThreshold: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
        - name: init
          secret:
            secretName: database
            items:
              - key: init.sql
                path: 001-api-user.sql
